[project]
name = "tradewatch"
version = "0.1.0"
description = "Market intelligence and paper-trading platform — backend services"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }

# Phase 0 dependencies only. Each phase adds what it needs, with a justification in the
# pull request (see DEVELOPMENT_PLAN.md "Definition of Done"). Database, Kafka, Redis and
# ML dependencies are deliberately absent until the phase that uses them.
dependencies = [
    "aiokafka>=0.12",
    "alembic>=1.16",
    # Phase 5 (ADR-0010): Argon2id password hashing. The reference implementation — a
    # ctypes/cffi binding to the C library the Argon2 competition winners maintain, not a
    # pure-Python reimplementation of a KDF that is deliberately expensive to get right.
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "fastapi>=0.118",
    "httpx2>=2.13",
    # Phase 8 (ADR-0008): serializing the trained IsolationForest artifact. Preferred over
    # raw pickle for numpy-array-heavy objects — same underlying format, faster and smaller
    # for this shape of data, and it is scikit-learn's own documented recommendation.
    "joblib>=1.4",
    # Phase 8 (ADR-0008): feature arrays for the baseline (median/MAD) and the model
    # (IsolationForest) — both need vectorized numeric work that pure Python's `statistics`
    # module does not offer efficiently at this data volume.
    "numpy>=2.1",
    # Phase 5 (ADR-0010): JWT access tokens. The most-used pure-Python JWT library, HS256
    # support built in, no extra crypto backend needed for the symmetric algorithm this
    # phase uses.
    "pyjwt>=2.10",
    # [email] pulls in `email-validator` for `EmailStr` (Phase 5 registration/login
    # requests) — RFC-compliant address validation rather than a hand-rolled regex.
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.11",
    # Phase 4 (ADR-0003): cache + WebSocket fan-out via Pub/Sub. redis-py ships its own
    # asyncio client (`redis.asyncio`) since 4.2, so no separate aioredis package is needed.
    "redis>=6.0",
    # Phase 8 (ADR-0008): the model tier. Unsupervised, well-understood, and ships with the
    # `IsolationForest` estimator ADR-0008 names — no heavier ML framework justified for one
    # estimator trained offline on tabular features.
    "scikit-learn>=1.7",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.4",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.38",
    "websockets>=15",
]

[project.scripts]
tradewatch-api = "tradewatch.api.__main__:main"
# The Phase 2 primary path: two processes, a durable log between them (ADR-0001).
tradewatch-producer = "tradewatch.workers.market_data_producer:main"
tradewatch-consumer = "tradewatch.workers.market_data_consumer:main"
# Phase 3: the second consumer group, and the history it needs (ADR-0001).
tradewatch-aggregator = "tradewatch.workers.bar_aggregator:main"
# Phase 4: Kafka -> Redis Pub/Sub fan-out, so /ws/market has something to relay.
tradewatch-broadcaster = "tradewatch.workers.broadcaster:main"
tradewatch-backfill = "tradewatch.workers.backfill:main"
# Phase 6: claims `backtest_runs` rows via FOR UPDATE SKIP LOCKED and runs them (ADR-0007).
tradewatch-backtest-runner = "tradewatch.workers.backtest_runner:main"
# Phase 7: the fourth independent reader of tw.market.bars.1m.v1 (ADR-0001), running
# deployed strategies through the same Execution Simulator the backtest runner uses.
tradewatch-paper-trading = "tradewatch.workers.paper_trading:main"
# Phase 8: the fifth independent reader of tw.market.bars.1m.v1 (ADR-0001), scoring each
# closed bar for statistically unusual activity and publishing tw.anomalies.v1.
tradewatch-anomaly-detector = "tradewatch.workers.anomaly_detector:main"
# Phase 9: consumes tw.anomalies.v1 and tw.fills.v1, the one point where the Phase 6/7
# trading track and the Phase 8 detection track meet.
tradewatch-alert-dispatcher = "tradewatch.workers.alert_dispatcher:main"
tradewatch-ingest = "tradewatch.workers.ingestion:main"
# The Phase 1 single-process path, kept for development without a broker. No replay, no
# restart safety, no independent failure domains — see docs/PIPELINE.md.
tradewatch-pipeline = "tradewatch.workers.pipeline:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    # Phase 6: property-based tests on position/cash arithmetic (DEVELOPMENT_PLAN.md's own
    # exit criterion) — generated fill sequences find the edge case a hand-picked one misses.
    "hypothesis>=6.130",
    "import-linter>=2.3",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradewatch"]


# ---------------------------------------------------------------------------
# Ruff — linting and formatting (replaces black, isort, flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez — naive datetimes are a real bug class here
    "T20",    # flake8-print — logging, not print
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "S",      # bandit — security lint
]
ignore = [
    "S101",  # assert: pytest uses it, and it is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S105",  # hardcoded password string — test fixtures
    "S106",  # hardcoded password argument — test fixtures
]
"alembic/versions/**" = [
    # Migrations are generated. Reformatting the DDL they emit would make them diverge
    # from what autogenerate produces, and reviewing a migration means reading the SQL,
    # not admiring its wrapping.
    "E501",
]
"scripts/**" = [
    # A CLI script's whole job is to print its result. structlog is for the services;
    # a one-off benchmark's output is not a log line for something to parse.
    "T201",
]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["logging"]

[tool.ruff.lint.isort]
known-first-party = ["tradewatch"]

[tool.ruff.format]
docstring-code-format = true


# ---------------------------------------------------------------------------
# mypy — strict on the packages that carry the domain rules
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = ["src", "."]
explicit_package_bases = true
files = ["src/tradewatch", "tests"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Tests are checked, but without requiring full annotations on every fixture. `strict` turns
# on both `disallow_untyped_defs` and `disallow_incomplete_defs`; a fixture with a `-> None`
# return annotation but untyped parameters is "incomplete", not "untyped", so both must be
# disabled here or that one case still errors despite this override's own stated intent.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# aiokafka ships no `py.typed` marker, so mypy cannot see its annotations. This silences
# that one import, and nothing else: strict mode still applies in full to every module
# that uses it. The adapters declare narrow `ProducerClient` / `ConsumerClient` protocols
# over the handful of methods they call, so the untyped surface stops at the boundary
# instead of leaking `Any` into the codebase — which is also what makes those clients
# substitutable in tests.
module = ["aiokafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Neither scikit-learn nor joblib ships a `py.typed` marker. Same treatment as aiokafka
# above: `application.detection.model` is the only module that touches either, and its own
# public functions are fully annotated, so the untyped surface stops there.
module = ["joblib.*", "sklearn.*"]
ignore_missing_imports = true


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # Live provider tests are opt-in. `pytest` must never reach the network by accident,
    # and CI must never depend on a third party's uptime. An explicit `-m provider` on the
    # command line overrides this, because the last -m wins.
    "-m", "not provider",
]
markers = [
    "unit: pure, no I/O, no containers (must stay fast)",
    "integration: requires real infrastructure (PostgreSQL, Redis, Kafka)",
    "api: exercises the HTTP surface in-process",
    "e2e: full stack through a browser",
    "provider: talks to a real market data provider; needs credentials, skipped otherwise",
    "slow: anything that should not run on every save",
]
asyncio_mode = "auto"
# One event loop for the whole session. The database engine is session-scoped — building
# the schema per test would be slow and pointless — and an engine created in one loop
# cannot be used from another.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Warnings are errors: a DeprecationWarning is a scheduled breakage, and finding it in CI
# is cheaper than finding it on an upgrade. Third-party warnings we cannot fix are ignored
# one at a time, with the reason, rather than by relaxing the rule.
filterwarnings = [
    "error",
    # starlette 1.6.0 touches a deprecated anyio alias at import time.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/tradewatch"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]


# ---------------------------------------------------------------------------
# import-linter — enforces the layering that ARCHITECTURE.md assumes
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "tradewatch"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: domain knows nothing about the outside world"
type = "layers"
layers = [
    "tradewatch.api | tradewatch.workers",
    "tradewatch.application",
    "tradewatch.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is independent of infrastructure"
type = "forbidden"
source_modules = ["tradewatch.domain"]
forbidden_modules = [
    "tradewatch.infrastructure",
    "tradewatch.api",
    "tradewatch.workers",
]

[[tool.importlinter.contracts]]
name = "Application depends on ports, not adapters"
type = "forbidden"
source_modules = ["tradewatch.application"]
forbidden_modules = ["tradewatch.infrastructure"]

[[tool.importlinter.contracts]]
name = "Domain is independent of frameworks"
type = "forbidden"
source_modules = ["tradewatch.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "redis", "uvicorn"]

[[tool.importlinter.contracts]]
# Phase 2's central claim, made checkable. The application gained a Kafka consumer, and
# the thing that would quietly undo the seam is one `from aiokafka import ...` in a
# service — at which point the in-memory bus stops being able to stand in for the broker
# and every consumer test needs infrastructure. The contract above already forbids
# application → infrastructure; this forbids reaching past it to the library directly.
name = "Kafka is an adapter: nothing above infrastructure imports a broker client"
type = "forbidden"
source_modules = [
    "tradewatch.domain",
    "tradewatch.application",
    "tradewatch.api",
]
forbidden_modules = ["aiokafka", "kafka"]

# Redis gets no equivalent "is an adapter" contract. Unlike Kafka, the API legitimately
# holds a `RedisCache` directly on `app.state` (`api/app.py`, mirroring `Database`) — it
# reads and writes the cache itself, on the request path, the same way it owns a database
# session. `domain` already forbids `redis` directly ("frameworks" contract above), and
# `application` already cannot reach it at all ("depends on ports, not adapters" above);
# together those are the actual boundary this project draws around Redis.
