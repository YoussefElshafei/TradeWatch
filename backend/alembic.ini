# Alembic configuration.
#
# The database URL is deliberately absent: it comes from TW_DATABASE_URL via the typed
# settings object (see alembic/env.py). A connection string in a committed file is a
# credential in a committed file, and it is also how someone runs a migration against the
# wrong database.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Timestamped, readable filenames, so `ls versions/` reads as a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timestamps in migration filenames are UTC, like everything else here.
timezone = UTC

[post_write_hooks]
# Generated migrations go through the same formatter as hand-written code.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
