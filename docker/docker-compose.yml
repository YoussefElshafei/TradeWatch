# TradeWatch local development stack.
#
#   docker compose -f docker/docker-compose.yml up -d           # infrastructure only
#   docker compose -f docker/docker-compose.yml --profile app up  # + the API in a container
#
# PostgreSQL, Redis and Kafka, plus (Phase 10) Prometheus on :9090, Grafana on :3000 with
# the TradeWatch dashboard as its home page, and kafka-exporter for consumer-group lag.
#
# The API and the frontend normally run on the host during development, because the
# reload loop is faster and the debugger just works. The `app` profile exists for
# verifying that the container image itself is correct.

name: tradewatch

services:
  postgres:
    image: postgres:17-alpine
    container_name: tradewatch-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradewatch}
      POSTGRES_DB: ${POSTGRES_DB:-tradewatch}
      # Deterministic ordering and timestamps, so a query result does not depend on the
      # host's locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to loopback: this database has development credentials and must not be
      # reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the tradewatch_test database on first start, so integration tests have
      # somewhere to run that is never the application database.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tradewatch} -d ${POSTGRES_DB:-tradewatch}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: tradewatch-redis
    # No persistence: Redis is a cache and a fan-out bus here, never the system of record
    # (ADR-0003). Losing it must cost nothing but a cold cache — and starting it this way
    # means that assumption is tested every time the stack restarts.
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    # KRaft mode: broker and controller in one process, no ZooKeeper (ADR-0001). One broker
    # is the right size for a laptop and the wrong size for anything else — which is why
    # every replication factor below is 1 and says so.
    image: apache/kafka:4.0.0
    container_name: tradewatch-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Two client listeners on purpose. Containers reach the broker as `kafka:19092`; the
      # host reaches it as `127.0.0.1:9092`. A single advertised listener cannot be correct
      # for both, and getting this wrong produces a client that connects, fetches metadata,
      # and then times out talking to an address it cannot route to.
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      # Single broker: nothing can be replicated, and pretending otherwise makes every
      # internal topic fail to create.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # No waiting for a second consumer that is never coming.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created deliberately, with the partition count the ordering guarantee
      # needs (see tradewatch.infrastructure.events.kafka.admin). Auto-creation would give
      # a one-partition topic to whoever connected first and hide the mistake.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: tradewatch-local-cluster
      TZ: UTC
    ports:
      - '127.0.0.1:9092:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Asks the broker to list topics over the host listener: proves it is not merely
      # running but actually serving the API the workers use.
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # --- Observability (Phase 10) -------------------------------------------------------
  # Consumer-group lag, read from the broker's committed offsets. Outside the consumers on
  # purpose: a consumer cannot report its own lag while it is down, which is exactly when
  # the number matters (failure F10, and the recovery benchmark).
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: tradewatch-kafka-exporter
    command: ['--kafka.server=kafka:19092']
    ports:
      - '127.0.0.1:9308:9308'
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: tradewatch-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # The services run on the host; this name resolves to it on Docker Desktop, and the
    # mapping makes it resolve on Linux too.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: tradewatch-grafana
    environment:
      # Local development only: anonymous read access so the dashboard opens without a
      # login. Bound to loopback below, like everything else in this file.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tradewatch.json
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ['app']
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: tradewatch-api
    environment:
      TW_ENV: local
      TW_LOG_FORMAT: json
      TW_API_HOST: 0.0.0.0
      TW_API_PORT: 8010
      TW_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tradewatch}:${POSTGRES_PASSWORD:-tradewatch}@postgres:5432/${POSTGRES_DB:-tradewatch}
      TW_REDIS_URL: redis://redis:6379/0
      TW_KAFKA_BOOTSTRAP: kafka:19092
      TW_JWT_SECRET: ${TW_JWT_SECRET:-container-local-development-secret}
    ports:
      - '127.0.0.1:8010:8010'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
    name: tradewatch-postgres-data
  kafka-data:
    name: tradewatch-kafka-data
  prometheus-data:
    name: tradewatch-prometheus-data
